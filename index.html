<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>AI 開發隨身記憶卡 — 總目錄</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-alt: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warning: #d97706;
      --warning-soft: #fef3c7;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f172a;
        --card: #1e293b;
        --card-alt: #334155;
        --border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --primary-soft: rgba(59, 130, 246, 0.2);
        --success: #22c55e;
        --success-soft: rgba(34, 197, 94, 0.2);
        --warning: #f59e0b;
        --warning-soft: rgba(245, 158, 11, 0.2);
        --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --card-alt: #334155;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.2);
      --success: #22c55e;
      --success-soft: rgba(34, 197, 94, 0.2);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.2);
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 48px) 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 14px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 2px 0 0 0;
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .summary-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .summary-label {
      font-size: 14px;
      font-weight: 700;
    }

    .summary-num {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .progress-track {
      height: 10px;
      background: var(--card-alt);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .deck-list {
      display: grid;
      gap: 12px;
    }

    .deck-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent, var(--primary));
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .deck-card:active {
      transform: scale(0.985);
    }

    .deck-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .deck-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
    }

    .deck-arrow {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent, var(--primary));
      white-space: nowrap;
    }

    .deck-desc {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 12px 0;
    }

    .deck-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .pill {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--card-alt);
      color: var(--muted);
    }

    .pill-done {
      background: var(--success-soft);
      color: var(--success);
    }

    .pill-review {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .mini-track {
      height: 6px;
      background: var(--card-alt);
      border-radius: 999px;
      overflow: hidden;
    }

    .mini-fill {
      height: 100%;
      width: 0%;
      background: var(--accent, var(--primary));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .footer-tip {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 class="title">📚 AI 開發隨身記憶卡</h1>
        <p class="subtitle">單卡主動回想・題庫全覽・流程總覽</p>
      </div>
      <button onclick="toggleTheme()" class="icon-btn" title="切換深淺色">🌓 切換主題</button>
    </div>

    <div class="summary-card">
      <div class="summary-top">
        <span class="summary-label">🎯 整體熟練度</span>
        <span id="total-progress" class="summary-num">0 / 40 題（0%）</span>
      </div>
      <div class="progress-track">
        <div id="total-bar" class="progress-fill"></div>
      </div>
    </div>

    <div id="deck-list" class="deck-list"></div>

    <div class="footer-tip">
      💡 iPhone Safari 可點「分享 → 加入主畫面」當成隨身學習 App 使用<br />
      所有進度皆自動儲存在本機瀏覽器，支援離線閱讀
    </div>
  </div>

  <script>
    const THEME_KEY = "agy_study_theme_v1";
    const DECKS = [
      {
        title: "🔌 MCP 架構與使用",
        desc: "Host / Client / Server 三層、Tools / Resources / Prompts、stdio 與安全治理邊界",
        href: "mcp_mobile_study.html",
        storageKey: "agy_mcp_flashcards_v1",
        total: 10,
        accent: "#2563eb"
      },
      {
        title: "🌿 Git 工作流程",
        desc: "核心四區流向、Feature Branch + PR 協作、Merge vs Rebase、Reset / Revert / Reflog 急救",
        href: "git_mobile_study.html",
        storageKey: "agy_git_flashcards_v1",
        total: 10,
        accent: "#ea580c"
      },
      {
        title: "🌐 API 請求與回應流程",
        desc: "HTTP 生命週期、RESTful 與狀態碼（401 vs 403）、JWT 驗證、CORS 預檢與 Network/cURL 除錯",
        href: "api_mobile_study.html",
        storageKey: "agy_api_flashcards_v1",
        total: 10,
        accent: "#0d9488"
      },
      {
        title: "⚛️ React 渲染與開發流程",
        desc: "Trigger → Render → Commit、單向資料流、Immutable State、useEffect 清理與 API 防競態",
        href: "react_mobile_study.html",
        storageKey: "agy_react_flashcards_v1",
        total: 10,
        accent: "#0284c7"
      }
    ];

    try {
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
    } catch (_) {}

    function toggleTheme() {
      const root = document.documentElement;
      const cur = root.getAttribute("data-theme");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = cur ? cur === "dark" : prefersDark;
      const next = isDark ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
    }

    function readStats(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return { mastered: 0, review: 0 };
        const map = JSON.parse(raw) || {};
        const vals = Object.values(map);
        return {
          mastered: vals.filter(v => v === "mastered").length,
          review: vals.filter(v => v === "review").length
        };
      } catch (_) {
        return { mastered: 0, review: 0 };
      }
    }

    function renderDecks() {
      let totalMastered = 0;
      let totalCards = 0;

      const html = DECKS.map(deck => {
        const { mastered, review } = readStats(deck.storageKey);
        totalMastered += mastered;
        totalCards += deck.total;
        const pct = Math.round((mastered / deck.total) * 100);

        return `
          <a class="deck-card" href="${deck.href}" style="--accent:${deck.accent};">
            <div class="deck-top">
              <h2 class="deck-title">${deck.title}</h2>
              <span class="deck-arrow">開始練習 →</span>
            </div>
            <p class="deck-desc">${deck.desc}</p>
            <div class="deck-meta">
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <span class="pill ${mastered === deck.total ? 'pill-done' : ''}">已記住 ${mastered} / ${deck.total}</span>
                ${review > 0 ? `<span class="pill pill-review">待複習 ${review}</span>` : ""}
              </div>
              <span style="color:var(--muted);">${pct}%</span>
            </div>
            <div class="mini-track">
              <div class="mini-fill" style="width:${pct}%;"></div>
            </div>
          </a>
        `;
      }).join("");

      document.getElementById("deck-list").innerHTML = html;
      const totalPct = totalCards ? Math.round((totalMastered / totalCards) * 100) : 0;
      document.getElementById("total-progress").textContent = `${totalMastered} / ${totalCards} 題（${totalPct}%）`;
      document.getElementById("total-bar").style.width = `${totalPct}%`;
    }

    renderDecks();
    window.addEventListener("pageshow", renderDecks);
  </script>
</body>
</html>
